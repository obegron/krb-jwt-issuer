name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: go.mod }
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 -cover ./...
      - name: Fuzz the mint decoder briefly
        run: go test -run '^$' -fuzz FuzzMintBody -fuzztime 20s .
      - name: Integration module still compiles (it needs a live deployment to run)
        working-directory: integration
        run: go vet ./...
      - name: Deploy scripts parse
        run: python3 -m py_compile deploy/install.py deploy/configure-browsers.py
      - name: Cross-build the released targets
        run: |
          for t in linux/arm/7 linux/arm64/ linux/amd64/; do
            IFS=/ read -r os arch arm <<<"$t"
            echo "== $os/$arch$arm"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=$arm go build -trimpath -o /dev/null .
          done
      - name: Keep the code portable (compile only, not released)
        run: |
          for t in darwin/arm64 freebsd/amd64 windows/amd64; do
            echo "== $t"
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null .
          done
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: go.mod }
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
