name: Release
# Push a tag such as v0.1.0 (or v0.1.0-rc1). The tag must point at a commit on main.
# Requires the repository setting "Immutable releases" to be enabled: the release is
# created as a draft, all assets are attached, and only then published and locked.
on:
  push:
    tags: ['v*']
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: go.mod }
      - run: go vet ./... && go test -race -count=1 ./...

  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { goarch: arm, goarm: '7', name: linux-armv7 }
          - { goarch: arm64, goarm: '', name: linux-arm64 }
          - { goarch: amd64, goarm: '', name: linux-amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with: { go-version-file: go.mod }
      - name: Build and package
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '0'
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.name }}
        run: |
          set -euo pipefail
          pkg="krb-jwt-issuer-${TAG}-${TARGET}"
          mkdir -p "dist/$pkg"
          go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o "dist/$pkg/krb-jwt-issuer" .
          cp -r deploy config.example.json README.md LICENSE "dist/$pkg/"
          # Fixed ordering and timestamps so the archive is deterministic.
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$(git log -1 --format=%ct)" \
            -C dist -czf "dist/$pkg.tar.gz" "$pkg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: krb-jwt-issuer-${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the release
      id-token: write       # keyless signing for the attestation
      attestations: write   # store build provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { path: assets, pattern: krb-jwt-issuer-*, merge-multiple: true }
      - name: Checksums
        working-directory: assets
        run: sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            assets/*.tar.gz
            assets/SHA256SUMS
      - name: Draft, upload, publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flags=(--verify-tag --generate-notes)
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --draft "${flags[@]}" assets/*
          gh release edit "$TAG" --draft=false   # becomes immutable here
