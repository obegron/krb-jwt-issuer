# Template: deploy/install.py substitutes auth.example.com and the certificate directory.

# nginx runs limit_req before authentication, so a plain per-IP limit would also
# count the unauthenticated 401 round trip of every Negotiate handshake. Only
# requests that already carry a Negotiate token are counted. The issuer itself
# enforces a per-principal limit after authentication.
map $http_authorization $krb_jwt_issuer_mint_key {
    default "";
    "~^Negotiate " $binary_remote_addr;
}
limit_req_zone $krb_jwt_issuer_mint_key zone=krb_jwt_issuer_mint:64k rate=30r/m;

server {
    listen 80;
    server_name auth.example.com;
    return 301 https://auth.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name auth.example.com;
    ssl_certificate /etc/nginx/ssl/example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/example.com/privkey.pem;
    http2 off;

    # nginx only authenticates. Which principals may mint, and for which
    # audiences, is decided in exactly one place: /etc/krb-jwt-issuer/config.json.
    auth_gss on;
    auth_gss_keytab /etc/nginx/krb5-auth.keytab;
    auth_gss_service_name HTTP/auth.example.com;
    auth_gss_format_full on;
    auth_gss_allow_basic_fallback off;
    auth_gss_delegate_credentials off;

    # Discovery and public keys must be usable by consumers without Kerberos.
    location = /issuer {
        auth_gss off;
        proxy_set_header Host auth.example.com;
        proxy_set_header X-Authenticated-Principal "";
        proxy_set_header Authorization "";
        proxy_pass http://unix:/run/krb-jwt-issuer.sock;
    }
    location = /issuer/.well-known/openid-configuration {
        auth_gss off;
        proxy_set_header Host auth.example.com;
        proxy_set_header X-Authenticated-Principal "";
        proxy_set_header Authorization "";
        proxy_pass http://unix:/run/krb-jwt-issuer.sock;
    }
    location = /issuer/jwks.json {
        auth_gss off;
        proxy_set_header Host auth.example.com;
        proxy_set_header X-Authenticated-Principal "";
        proxy_set_header Authorization "";
        proxy_pass http://unix:/run/krb-jwt-issuer.sock;
    }

    location = /issuer/mint {
        limit_req zone=krb_jwt_issuer_mint burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_set_header Host auth.example.com;
        proxy_set_header X-Authenticated-Principal $remote_user;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_pass http://unix:/run/krb-jwt-issuer.sock;
    }
    location = /issuer/whoami {
        proxy_set_header Host auth.example.com;
        proxy_set_header X-Authenticated-Principal $remote_user;
        proxy_set_header Authorization "";
        proxy_pass http://unix:/run/krb-jwt-issuer.sock;
    }

    # Plain-text identity check, with authentication before SSI rendering.
    # Requires /var/www/kerberos-test/whoami.txt containing: <!--# echo var="remote_user" -->
    location = /whoami {
        root /var/www/kerberos-test;
        try_files /whoami.txt =404;
        default_type text/plain;
        ssi on;
        ssi_types text/plain;
        add_header Cache-Control "no-store" always;
    }
    location / {
        return 404;
    }
}
